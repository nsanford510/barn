<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VPT - Set Password</title>
{% include "_auth_styles.html" %}
</head>

<body>
  <div class="login-container">
    <h1>Set your password</h1>
    <p class="subtitle">For your VPT Scanner account</p>

    {% if not supabase_url or not supabase_anon_key %}
    <div class="config-warn">Supabase Auth is not configured.</div>
    {% else %}
    <form id="reset-form">
      <div class="form-group">
        <label for="password">New password</label>
        <input type="password" id="password" minlength="8" required autocomplete="new-password" autofocus>
      </div>
      <div class="form-group">
        <label for="confirm">Confirm password</label>
        <input type="password" id="confirm" minlength="8" required autocomplete="new-password">
      </div>
      <button type="submit" id="btn-submit" disabled>Save password</button>
    </form>
    <p class="hint"><a href="/login">Back to sign in</a></p>
    {% endif %}
  </div>

  {% if supabase_url and supabase_anon_key %}
{% include "_auth_client.html" %}
  <script>
    (function () {
      var auth = window.barnAuth;
      var supabase = auth.client;
      var btn = document.getElementById('btn-submit');
      if (!supabase) {
        auth.showMessage('Supabase script did not load. Check your connection or try again.');
        return;
      }

      // The reset or invite link puts a one-time session in the URL; supabase-js
      // reads it on load. Without one, there is nothing to update.
      var params = new URLSearchParams(location.hash.slice(1));
      if (params.get('error_description')) {
        auth.showMessage(params.get('error_description') + ' Request a new link from the sign-in page.');
        return;
      }
      supabase.auth.getSession().then(function (res) {
        if (res.data.session) {
          btn.disabled = false;
        } else {
          auth.showMessage('This link is invalid or has expired. Request a new one from the sign-in page.');
        }
      });

      document.getElementById('reset-form').addEventListener('submit', async function (e) {
        e.preventDefault();
        var password = document.getElementById('password').value;
        if (password !== document.getElementById('confirm').value) {
          auth.showMessage('Passwords do not match.');
          return;
        }
        btn.disabled = true;
        var res = await supabase.auth.updateUser({ password: password });
        if (res.error) {
          auth.showMessage(res.error.message || 'Could not update password.');
          btn.disabled = false;
          return;
        }
        await supabase.auth.signOut();
        auth.showMessage('Password saved. Redirecting to sign in…', 'notice');
        setTimeout(function () { location.href = '/login'; }, 1500);
      });
    })();
  </script>
  {% endif %}
</body>

</html>
