name: Validate and deploy Gemini assistant
on:
  push:
    branches: [codex/gemini-live-assistant]
    paths:
      - 'web/supabase/functions/**'
      - '.github/workflows/gemini-assistant.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  assistant:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Check edge function and test research and live relay
        run: |
          deno check web/supabase/functions/property-assistant/index.ts
          deno test web/supabase/functions/_shared/
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy when Supabase access is configured
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo 'Backend not deployed: add SUPABASE_ACCESS_TOKEN to this repository Actions secrets, then rerun this workflow.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          supabase functions deploy property-assistant --workdir web --project-ref zezhsmgtdzlagqwlvjui
          echo 'Deployed property-assistant to BARN Supabase.' >> "$GITHUB_STEP_SUMMARY"
